[package]
name = "helio-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Helio: the `helio` command line (streaming, pairing, the host)"

[dependencies]
helio-client = { path = "../helio-client" }
helio-pairing = { path = "../helio-pairing" }
helio-proto = { path = "../helio-proto" }
helio-transport = { path = "../helio-transport" }
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The scripted `paste` step reads this computer's clipboard (script.rs).
arboard = "3"

[[bin]]
name = "helio"
path = "src/main.rs"
