[package]
name = "helio-host-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Helio Host's data: its folder, its identity, its paired clients"

# Light on purpose: `helio` (helio-cli) and the app link it, and on Linux the
# host's own dependencies cannot share a build with GPUI's
# (docs/development.md).
[dependencies]
helio-proto = { path = "../helio-proto" }
helio-transport = { path = "../helio-transport" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
