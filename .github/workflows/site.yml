# The website, from every push to landing-page that changes what it is built
# from: site/ itself, the release in Casks/ and the UI's icons (see "The
# website" in docs/development.md). Astro builds it and wrangler deploys it
# to the Cloudflare Worker that serves helio.mihaicristian.dev
# (site/wrangler.jsonc). This workflow lives on landing-page only, as the
# site does.
#
# workflow_dispatch: to deploy by hand, from the branch it is run on.
#
# It needs two settings in the repository: the secret CLOUDFLARE_SITE_TOKEN
# (an API token from the "Edit Cloudflare Workers" template, for this account
# and the zone mihaicristian.dev) and the variable CLOUDFLARE_ACCOUNT_ID.
name: Website

on:
  push:
    branches: [landing-page]
    paths:
      - "site/**"
      - "Casks/**"
      - "helio-ui/assets/icons/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One deployment at a time; of those waiting, only the newest runs.
concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 deploy
