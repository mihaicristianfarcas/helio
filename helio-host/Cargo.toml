[package]
name = "helio-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Helio Host: the Helio streaming host (Windows, macOS, Linux)"

[features]
# Windows: `helio-host enable` refuses an engine without a valid Authenticode
# signature by HELIO_HOST_WINDOWS_PUBLISHER (set at build time) instead of only
# warning. The release workflow builds with it once the Windows programs are
# signed (tools/package-windows.ps1 -RequireSignature); a debug build never
# requires it (helio-host/src/hosting/signature.rs).
require-signature = []

[dependencies]
helio-proto = { path = "../helio-proto" }
helio-host-data = { path = "../helio-host-data" }
helio-transport = { path = "../helio-transport" }
helio-display = { path = "../helio-display" }
helio-input = { path = "../helio-input" }
helio-pairing = { path = "../helio-pairing" }
helio-nat = { path = "../helio-nat" }
crossbeam-channel = "0.5"
helio-clipboard = { path = "../helio-clipboard" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
# Web UI
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"
argon2 = "0.5"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
ctrlc = { version = "3", features = ["termination"] }
helio-audio = { path = "../helio-audio" }
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber"] }
helio-capture = { path = "../helio-capture" }
helio-encode = { path = "../helio-encode" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "inhibit", "remote_desktop", "screencast"] }
ctrlc = { version = "3", features = ["termination"] }
enumflags2 = "0.7"
# mutter's virtual monitor (its D-Bus signals, through ashpd's zbus).
futures-util = { version = "0.3", default-features = false }
helio-audio = { path = "../helio-audio" }
helio-capture = { path = "../helio-capture" }
helio-encode = { path = "../helio-encode" }
libc = "0.2"
# KWin's virtual output and fake input (helio-host/src/linux/kwin.rs).
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
x11rb = { version = "0.13", features = ["dpms", "screensaver"] }

[target.'cfg(windows)'.dependencies]
helio-audio = { path = "../helio-audio" }
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
helio-capture = { path = "../helio-capture" }
helio-encode = { path = "../helio-encode" }
windows-service = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
