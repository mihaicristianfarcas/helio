<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Helio's icon, and the one source of every other: the app's and Helio
    Host's on each system, the menu bar mark, the welcome page's and the
    site's (helio-app/examples/make-icon.rs draws them all from this file).

    Apple's grid: an 824-pixel rounded square with 185-pixel corners,
    centred on a 1024-pixel canvas, its shadow in the margin. On it a
    lowercase h stands on the baseline at y 762: its stem rises to 262, cut
    at an angle; its shoulder, 96 wide like the stem, starts a gap away
    from the stem, runs flat and turns down at a tight corner.

    The generator relies on the two groups' ids, on the body's shadow
    filter and on the mark's colour attribute: keep them.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE9FC"/>
      <stop offset="1" stop-color="#ACC6F0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g id="body">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)" filter="url(#shadow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#edge)" stroke-width="4"/>
  </g>
  <g id="mark" color="#16213A">
    <polygon points="347,326 443,262 443,762 347,762" fill="currentColor"/>
    <path d="M477 480H539Q629 480 629 570V762" fill="none" stroke="currentColor" stroke-width="96"/>
  </g>
</svg>
