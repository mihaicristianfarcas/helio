<!doctype html><html><head><meta charset="utf-8">
<!--
  The link preview (public/og.jpg), 1200x630, in the page's look: the logo's
  ink and blues only, the hero's title, and its two pictures: a stream in
  Helio's window in front of the host's Overview (src/assets/hero/). Any headless browser
  renders it at 1200x630; save the screenshot as public/og.jpg.
-->
<style>
@font-face { font-family: Geist; src: url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: Geist, system-ui; position: relative; background: #16213a; }
.copy { position: absolute; left: 64px; top: 64px; width: 480px; }
.logo { display: flex; align-items: center; gap: 14px; color: #d1dff6; font-weight: 600; font-size: 30px; letter-spacing: -0.015em; }
.logo img { width: 46px; height: 46px; }
h1 { margin-top: 56px; color: #d1dff6; font-size: 50px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; }
p { margin-top: 26px; color: rgb(209 223 246 / 0.62); font-size: 21px; line-height: 1.35; }
.win { position: absolute; width: 640px; border: 1px solid rgb(209 223 246 / 0.18); border-radius: 12px; }
.back { left: 620px; top: 48px; }
.front { left: 540px; top: 212px; }
</style></head><body>
<div class="copy">
  <div class="logo"><img src="../src/assets/helio.svg">Helio</div>
  <h1>Low-latency remote desktop and game streaming</h1>
  <p>For macOS, Windows and Linux.<br>Free and open source.</p>
</div>
<img class="win back" src="../src/assets/hero/host.webp">
<img class="win front" src="../src/assets/hero/stream.webp">
</body></html>
